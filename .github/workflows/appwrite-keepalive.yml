name: Appwrite Keepalive

# The app can sit idle for months. Appwrite Cloud does not pause on
# inactivity the way Supabase did, but may reclaim projects that get zero
# traffic for a very long time. A weekly request keeps it counted as active.
#
# GitHub also disables scheduled workflows after 60 days with no repository
# activity, which would silently stop the ping above. The keepalive job
# below runs on the same weekly schedule but only pushes an empty commit
# when nothing has been pushed to the branch in the last 45 days, so there
# is no git-log noise during active development.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Appwrite
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://fra.cloud.appwrite.io/v1/ping" \
            -H "X-Appwrite-Project: ${APPWRITE_PROJECT_ID}")
          echo "HTTP $code"
          # Any response means the project was reached. Only fail on a
          # network error (000) or a 5xx.
          case "$code" in
            000|5??) exit 1 ;;
          esac
        env:
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}

  keepalive:
    # Schedule only - a manual workflow_dispatch run just does the ping.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push empty commit if the branch has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago"
          if [ "$age_days" -lt 45 ]; then
            echo "Recent activity - nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pushed with the built-in GITHUB_TOKEN, which by design does not
          # trigger other workflows; the commit also touches no files, so
          # deploy.yml stays quiet.
          git commit --allow-empty -m "chore: keepalive empty commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
